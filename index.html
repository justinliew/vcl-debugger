<!doctype html>
<html>

<head>
    <title>VCL Debugger</title>

    <script src="https://unpkg.com/cytoscape@3.27.0/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
    <script src="https://unpkg.com/cytoscape-undo-redo@1.0.5/cytoscape-undo-redo.js"></script>
    <script src="https://unpkg.com/cytoscape-expand-collapse@4.1.1/cytoscape-expand-collapse.js"></script>

    <style>
        #function-list {
            top: 0;
            left: 0;
            width: 200px;
            bottom: 0;
            background: #f7f7f7;
            overflow-y: auto;
            border-right: 1px solid #ccc;
            padding: 10px;
            box-sizing: border-box;
            z-index: 10;
        }

        .sidebar-item {
            padding: 5px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
        }

        .sidebar-item:hover {
            background: #eee;
        }

        #trace-panel {
            font-family: monospace;
            font-size: 10px;
        }

        .condition-title {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .condition-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .condition-list li {
            background: #eef5ff;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 4px;
            word-break: break-word;
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            text-align: center;
        }

        .modal-button {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: #f7f7f7;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            transition: background-color 0.2s;
        }

        .modal-button:hover {
            background: #e7e7e7;
            border-color: #bbb;
        }

        .modal-button:last-child {
            margin-bottom: 0;
        }
    </style>
</head>

<body style="margin:0; height:100vh; display:flex; flex-direction:column;">

    <!-- Top input bar -->
    <div style="background:#eee; border-bottom:1px solid #ccc; padding:10px;">
        Sid: <input type="text" id="sidInput" placeholder="34s0wI9fTjkamT4QdIv1x3">
        Version: <input type="text" id="versionInput" placeholder="107">
        <button id="loadButton">Load</button>
        <input type="checkbox" id="navtogglebtn" onclick="toggleNavigation()">Navigation</button>
        <div id="step-controls"></div>
    </div>

    <!-- Main content layout: Sidebar | Cytoscape | Trace Panel -->
    <div style="flex:1; display:flex; min-height:0; overflow: hidden;">

        <!-- Function List -->
        <div id="function-list" style="
            width: 200px;
            overflow-y: auto;
            border-right: 1px solid #ccc;
            padding: 10px;
            background: #f7f7f7;
            flex-shrink: 0;
        "></div>

        <!-- Cytoscape Container -->
        <div id="cy" style="
            flex: 1;
            min-width: 0;
            min-height: 0;
            position: relative;
        "></div>

        <!-- Right Trace Panel -->
        <div id="trace-panel" style="
            width: 300px;
            overflow-y: auto;
            border-left: 1px solid #ccc;
            padding: 10px;
            background: #f7f7f7;
            flex-shrink: 0;
        ">
            <div class="condition-title">Branch Decisions</div>
            <ul id="condition-list" class="condition-list"></ul>
        </div>

        <!-- Parent Choice Modal -->
        <div id="parent-choice-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">Choose a parent node to step back to:</div>
                <div id="parent-choice-buttons"></div>
            </div>
        </div>

        <script>
            const searchParams = new URLSearchParams(window.location.search);
            const secret = searchParams.get('secret');

            let cy;
            let functionGraphs = new Map();

            // for expand/collapse
            let expandCollapseApi;
            let collapsedState = new Map();
            let previouslyExpandedParents = [];

            // for navigation
            let currentNodeId = null;
            let backStack = [];
            let forwardStack = [];
            let navigationTrace = []; // Array of { nodeId, parentId, condition, nodeName }
            let fullNavigationPath = []; // Complete path of all nodes visited

            let isNavigating = false;
            // let executionPointer; // Current node id
            // let navigationHistory = []; // [{ nodeId, parents: [] }]
            // let navIndex = -1;
            // let conditionTrace = [];     // Array of { nodeId, branchTrue }

            // pure data structs for inspection
            let reverseAdjacency = new Map();
            let parentMap = new Map();

            // const layoutParams = {
            //     name: 'dagre',
            //     rankDir: 'TB',
            //     nodeSep: 75,
            //     edgeSep: 15,
            //     rankSep: 100,
            //     ranker: 'network-simplex',
            //     minLen: 2,
            //     animate: false,
            //     spacingFactor: 1.2,
            //     avoidOverlap: true,
            //     padding: 10,
            //     fit: false
            // };
            const layoutParams = {
                name: 'dagre',
                rankDir: 'TB',
                fit: false
            };

            function findNameFromId(id) {
                return functionGraphs.get(id).name;
            }

            async function toggleNavigation() {
                isNavigating = document.getElementById('navtogglebtn').checked;

                if (isNavigating) clearConditionSidebar();
            }

            function getAllDescendants(node) {
                const descendants = [];

                function collect(id) {
                    const children = cy.nodes(`[parent = "${id}"]`);
                    for (const child of children) {
                        descendants.push(child);
                        collect(child.id()); // recursive
                    }
                }

                collect(node.id());
                return descendants;
            }

            // Store collapsed descendants before collapsing
            async function expandAllDescendantsRecursive(node, api) {
                const toExpand = getAllDescendants(node)
                    .filter(n => n.hasClass('cy-expand-collapse-collapsed-node'));
                collapsedState.set(node.id(), toExpand);

                for (const collapsed of toExpand) {
                    try {
                        await api.expand(collapsed);
                    } catch (e) {
                        console.warn('Expansion error on', collapsed, e);
                    }
                }
            }

            async function handle_expand_collapse(node) {
                try {
                    if (expandCollapseApi.expandableNodes([node]).length > 0) {
                        expandCollapseApi.expand(node);

                    } else if (expandCollapseApi.collapsibleNodes([node]).length > 0) {
                        await expandAllDescendantsRecursive(node, expandCollapseApi); // FULLY expand first
                        expandCollapseApi.collapse(node);
                    }
                } catch (err) {
                    console.warn('Expand/collapse error:', err);
                }
            }

            function clearConditionSidebar() {
                const conditionList = document.getElementById("condition-list");
                conditionList.innerHTML = "";
            }

            function clearNavigationTrace() {
                navigationTrace = [];
                fullNavigationPath = [];
                updateTracePanel();
                updatePathHighlighting();
            }

            function updatePathHighlighting() {
                // Clear all path highlighting
                cy.elements().removeClass('path-start path-node path-edge');
                
                if (fullNavigationPath.length === 0) return;
                
                // Highlight the start node
                const startNode = cy.getElementById(fullNavigationPath[0]);
                startNode.addClass('path-start');
                
                // Highlight the path nodes and edges
                for (let i = 1; i < fullNavigationPath.length; i++) {
                    const nodeId = fullNavigationPath[i];
                    const prevNodeId = fullNavigationPath[i - 1];
                    
                    // Highlight the node
                    const node = cy.getElementById(nodeId);
                    node.addClass('path-node');
                    
                    // Highlight the edge between previous and current node
                    const edge = cy.edges(`[source="${nodeId}"][target="${prevNodeId}"]`);
                    if (edge.length > 0) {
                        edge.addClass('path-edge');
                    }
                }
            }

            function addToNavigationTrace(nodeId, parentId = null, condition = null) {
                const node = cy.getElementById(nodeId);
                const nodeName = node.data('name') || nodeId;
                const nodeType = node.data('type');

                if (!parentId) {
                    // Starting node - always add it
                    navigationTrace.push({
                        nodeId: nodeId,
                        parentId: null,
                        condition: null,
                        nodeName: nodeName,
                        nodeType: nodeType,
                        branchType: null,
                        parentName: null
                    });
                } else {
                    // Navigation step - only add if navigating TO a conditional node
                    if (nodeType === 'conditional') {
                        const parentNode = cy.getElementById(parentId);
                        const parentName = parentNode.data('name') || parentId;

                        // Determine branch type from the condition that brought us TO this conditional
                        let branchType = '';
                        if (condition) {
                            const conditionLower = condition.toLowerCase().trim();
                            if (conditionLower === 'true' || conditionLower === 'yes') {
                                branchType = 'true';
                            } else if (conditionLower === 'false' || conditionLower === 'no') {
                                branchType = 'false';
                            } else if (condition.trim() === '') {
                                branchType = 'false';
                            } else {
                                branchType = condition;
                            }
                        } else {
                            branchType = 'false';
                        }

                        navigationTrace.push({
                            nodeId: nodeId,
                            parentId: parentId,
                            condition: condition,
                            nodeName: nodeName,
                            nodeType: nodeType,
                            branchType: branchType,
                            parentName: parentName
                        });
                    }
                }

                updateTracePanel();
            }

            function updateTracePanel() {
                const conditionList = document.getElementById("condition-list");
                conditionList.innerHTML = "";

                navigationTrace.forEach((trace, index) => {
                    const li = document.createElement("li");

                    let displayText;
                    if (index === 0) {
                        // Starting node
                        displayText = `Start: ${trace.nodeName}`;
                    } else {
                        // Show: conditional node with prominent branch result
                        displayText = `${trace.nodeName} [${trace.branchType.toUpperCase()}]`;
                    }

                    li.textContent = displayText;

                    // Style the current node differently
                    if (trace.nodeId === currentNodeId) {
                        li.style.backgroundColor = "#d4edda"; // Green for current
                        li.style.fontWeight = "bold";
                    } else {
                        // Color-code by branch type
                        if (trace.branchType === 'true') {
                            li.style.backgroundColor = "#d1ecf1"; // Light blue for true
                        } else if (trace.branchType === 'false') {
                            li.style.backgroundColor = "#f8d7da"; // Light red for false
                        } else if (trace.branchType === 'fallthrough') {
                            li.style.backgroundColor = "#fff3cd"; // Light yellow for fallthrough
                        } else {
                            li.style.backgroundColor = "#eef5ff"; // Default blue
                        }
                    }

                    conditionList.appendChild(li);
                });
            }

            function truncateTraceFromIndex(index) {
                // Remove all trace entries after the given index
                navigationTrace = navigationTrace.slice(0, index + 1);
                updateTracePanel();
            }

            function extractCondition(expression) {
                expression = expression.trim();

                if (expression.startsWith("if")) {
                    // Remove "if"
                    expression = expression.slice(2).trim();
                }

                // Remove surrounding parentheses if present
                if (expression.startsWith("(") && expression.endsWith(")")) {
                    expression = expression.slice(1, -1).trim();
                }

                return expression;
            }

            function updateConditionSidebar() {
                const cond = conditionTrace[conditionTrace.length - 1];
                const node = cy.getElementById(cond.nodeId);
                const text = extractCondition(`${node.data('name')}`);
                const conditionList = document.getElementById("condition-list");
                const li = document.createElement("li");
                li.textContent = text;
                li.style.backgroundColor = cond.branchTrue ? "#d4edda" : "#f8d7da"; // Green for true, Red for false

                conditionList.appendChild(li);
            }

            function updateButtons(preds) {
                const container = document.getElementById('step-controls');
                container.innerHTML = ''; // cleaar
                preds.forEach(p => {
                    const parentNode = cy.getElementById(p.source);
                    const label = parentNode.data('name' || p.source);
                    const condition = cy.getElementById(p.edge).data('name') || '';
                    console.log("pred ", p.source, p.edge, parentNode.data(), cy.getElementById(p.edge).data(), label, condition);

                    const btn = document.createElement('button');
                    btn.textContent = `${label} ${condition ? `[${condition}]` : ''}`;
                    btn.onclick = () => stepBackTo(p.source);
                    container.appendChild(btn);
                });
            }

            function getImmediatePredecessors(nodeId) {
                return reverseAdjacency[nodeId] || [];
            }

            function highlightCurrentNode() {
                // Remove current-node class from all nodes first
                cy.nodes().removeClass('current-node');
                // Add current-node class to the current node
                console.log("highlighting current node:", currentNodeId);
                const currentNode = cy.getElementById(currentNodeId);
                console.log("found node:", currentNode.length > 0 ? "yes" : "no");
                currentNode.addClass('current-node');
                console.log("classes on node:", currentNode.classes());
            }

            function navigateTo(nodeId) {
                currentNodeId = nodeId;
                cy.elements().removeClass('highlighted current-node');
                highlightCurrentNode();
                
                // Clear existing navigation trace and start fresh
                clearNavigationTrace();
                addToNavigationTrace(nodeId);
                
                // Start new path tracking
                fullNavigationPath = [nodeId];
                updatePathHighlighting();
            }

            function focusOnNode(newNodeId, prevNodeId, condition = null) {
                // Expand parents if collapsed
                let p = parentMap[newNodeId];
                while (p) {
                    expandCollapseApi.expand(cy.getElementById(p));
                    p = parentMap[p];
                }

                // Clear old highlights
                cy.elements().removeClass('highlighted current-node');

                // Focus viewport on new node
                const node = cy.getElementById(newNodeId);
                cy.animate({
                    center: { eles: node },
                    zoom: 1.2,
                    duration: 300
                });

                currentNodeId = newNodeId;
                highlightCurrentNode();

                // Add to navigation trace
                addToNavigationTrace(newNodeId, prevNodeId, condition);
                
                // Update path highlighting (path tracking is handled by navigation functions)
                updatePathHighlighting();
            }

            function promptParentChoice(parents) {
                return new Promise((resolve) => {
                    const modal = document.getElementById('parent-choice-modal');
                    const buttonsContainer = document.getElementById('parent-choice-buttons');

                    // Clear previous buttons
                    buttonsContainer.innerHTML = '';

                    // First, expand ALL parent nodes and their complete ancestor chains
                    parents.forEach(p => {
                        const parentNode = cy.getElementById(p.source);

                        // Build the complete ancestor chain from top down
                        const ancestorChain = [];
                        let currentAncestor = parentMap[p.source];

                        // Build the full ancestor chain
                        while (currentAncestor) {
                            ancestorChain.unshift(currentAncestor); // Add to front so we expand from top down
                            currentAncestor = parentMap[currentAncestor];
                        }

                        // Expand all ancestors from top-level down
                        ancestorChain.forEach(ancestorId => {
                            const ancestorNode = cy.getElementById(ancestorId);
                            if (expandCollapseApi && expandCollapseApi.expandableNodes([ancestorNode]).length > 0) {
                                try {
                                    expandCollapseApi.expand(ancestorNode);
                                } catch (e) {
                                    console.warn('Could not expand ancestor node:', ancestorId, e);
                                }
                            }
                        });

                        // Finally, expand the parent node itself
                        if (expandCollapseApi && expandCollapseApi.expandableNodes([parentNode]).length > 0) {
                            try {
                                expandCollapseApi.expand(parentNode);
                            } catch (e) {
                                console.warn('Could not expand parent node for choice display:', p.source, e);
                            }
                        }
                    });

                    // Function to highlight a specific parent node
                    function highlightParent(parentId) {
                        // Clear all highlights except current-node
                        cy.elements().removeClass('highlighted');

                        // Highlight the selected parent
                        const parentNode = cy.getElementById(parentId);
                        parentNode.addClass('highlighted');
                    }

                    // Create buttons for each parent option (now that they're expanded)
                    parents.forEach((p, i) => {
                        const btn = document.createElement('button');
                        btn.className = 'modal-button';
                        btn.setAttribute('data-parent-id', p.source);

                        const parentNode = cy.getElementById(p.source);
                        const parentName = parentNode.data('name') || p.source;

                        // Show more context: node name and edge condition if available
                        let displayText = `${i + 1}. ${parentName}`;
                        if (p.cond && p.cond.trim()) {
                            displayText += ` [${p.cond}]`;
                        }

                        btn.textContent = displayText;

                        // Add hover and focus event listeners for live preview
                        btn.addEventListener('mouseenter', () => {
                            highlightParent(p.source);
                        });

                        btn.addEventListener('focus', () => {
                            highlightParent(p.source);
                        });

                        btn.onclick = () => {
                            modal.style.display = 'none';
                            // Clear highlights before resolving (but keep current-node)
                            cy.elements().removeClass('highlighted');
                            resolve({
                                parentId: p.source,
                                condition: p.cond
                            });
                        };

                        buttonsContainer.appendChild(btn);
                    });

                    // Show the modal
                    modal.style.display = 'flex';

                    // Focus the first button for keyboard navigation and highlight its node
                    const firstButton = buttonsContainer.querySelector('.modal-button');
                    if (firstButton) {
                        firstButton.focus();
                        // Highlight the first option immediately
                        const firstParentId = firstButton.getAttribute('data-parent-id');
                        highlightParent(firstParentId);
                    }
                });
            }

            async function stepBackward() {
                const parents = reverseAdjacency[currentNodeId] || [];
                if (parents.length === 0) return; // at root

                // If multiple, prompt user
                let chosenParent, chosenCondition;
                if (parents.length === 1) {
                    chosenParent = parents[0].source;
                    chosenCondition = parents[0].cond;
                } else {
                    const chosenParentObj = await promptParentChoice(parents);
                    chosenParent = chosenParentObj.parentId;
                    chosenCondition = chosenParentObj.condition;
                }

                // Update path tracking for backward navigation
                if (!fullNavigationPath.includes(chosenParent)) {
                    fullNavigationPath.push(chosenParent);
                } else {
                    // If we're going to a node already in our path, truncate the path to that point
                    const parentIndex = fullNavigationPath.indexOf(chosenParent);
                    fullNavigationPath = fullNavigationPath.slice(0, parentIndex + 1);
                }

                // Don't truncate trace here - let the navigation build it naturally
                forwardStack.push(currentNodeId);
                backStack.push(chosenParent);
                focusOnNode(chosenParent, currentNodeId, chosenCondition);
            }

            function stepForward() {
                if (forwardStack.length === 0) return;
                const nextNode = forwardStack.pop();
                
                // Check if we're leaving a conditional node
                const currentNode = cy.getElementById(currentNodeId);
                const currentNodeType = currentNode.data('type');
                
                if (currentNodeType === 'conditional') {
                    // Remove the current conditional node from the trace since we're leaving it
                    navigationTrace = navigationTrace.filter(trace => trace.nodeId !== currentNodeId);
                }
                
                // Update path tracking for forward navigation
                if (!fullNavigationPath.includes(nextNode)) {
                    fullNavigationPath.push(nextNode);
                } else {
                    // If we're going to a node already in our path, truncate the path to that point
                    const nextNodeIndex = fullNavigationPath.indexOf(nextNode);
                    fullNavigationPath = fullNavigationPath.slice(0, nextNodeIndex + 1);
                }
                
                backStack.push(currentNodeId);

                // Find the condition for this forward step
                const edges = cy.edges(`[source="${currentNodeId}"][target="${nextNode}"]`);
                const condition = edges.length > 0 ? edges[0].data('name') : null;

                focusOnNode(nextNode, currentNodeId, condition);
            }

            function renderSidebar() {
                const sidebar = document.getElementById('function-list');
                sidebar.innerHTML = '<h3>Functions</h3>';

                for (const [fn, { nodes }] of functionGraphs.entries()) {
                    const item = document.createElement('div');
                    item.textContent = findNameFromId(fn);
                    item.className = 'sidebar-item';
                    item.addEventListener('click', () => loadFunctionGraph(fn));
                    sidebar.appendChild(item);
                }
            }

            function buildDataStructs(nodes, edges) {
                let nodemap = new Map();

                nodes.forEach(n => {
                    parentMap[n.data.id] = n.data.parent;
                    nodemap[n.data.id] = n;
                });

                edges.forEach(e => {
                    const tgt = e.data.target;
                    if (!reverseAdjacency[tgt]) reverseAdjacency[tgt] = [];

                    const obj = { source: e.data.source, edge: e.data.id, type: nodemap[e.data.source].data.type, cond: e.data.name, code: nodemap[e.data.source].data.name };

                    reverseAdjacency[tgt].push(obj);
                });
                nodes.forEach(n => {
                    if (!reverseAdjacency[n.data.id]) reverseAdjacency[n.data.id] = [];
                });
            }

            function loadFunctionGraph(fnName) {
                const { nodes, edges } = functionGraphs.get(fnName);
                buildDataStructs(nodes, edges);
                if (cy) {
                    cy.destroy();
                }

                cy = cytoscape({
                    container: document.getElementById('cy'),
                    elements: [...nodes, ...edges],
                    minZoom: 0.1,
                    maxZoom: 2.5,
                    style: [
                        {
                            selector: 'node[name]',
                            style: {
                                'shape': 'roundrectangle',
                                'text-wrap': 'wrap',
                                'text-max-width': 400,
                                'background-color': '#eeffee',
                                'label': 'data(name)',
                                'color': '#333',
                                'text-valign': 'center',
                                'text-halign': 'center',
                                'text-margin-x': 8,
                                'font-family': 'monospace',
                                'font-size': 10,
                                'width': 'data(width)',
                                'height': 'data(height)',
                                'padding': '8px',
                                'border-width': 2,
                                'border-color': '#eee'
                            }
                        },
                        { selector: 'node[type = "sub"]', style: { 'background-color': '#e0e0e0' } },
                        { selector: 'node[type = "conditional"]', style: { 'background-color': '#FFDD57' } },
                        { selector: 'node[type = "terminal"]', style: { 'background-color': '#EF5350' } },
                        {
                            selector: 'node[type = "start"]',
                            style: { 'background-color': '#81C784', 'shape': 'ellipse' }
                        },
                        {
                            selector: 'edge[name]',
                            style: {
                                'curve-style': 'bezier',
                                'target-arrow-shape': 'triangle',
                                'target-arrow-color': '#999',
                                'line-color': '#999',
                                'font-family': 'monospace',
                                'font-size': 10,
                                'width': 2,
                                'label': 'data(name)'
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'curve-style': 'bezier',
                                'target-arrow-shape': 'triangle',
                                'target-arrow-color': '#999',
                                'line-color': '#999',
                                'font-family': 'monospace',
                                'font-size': 10,
                                'width': 2
                            }
                        },
                        {
                            selector: 'node.cy-expand-collapse-collapsed-node',
                            style: {
                                'background-color': '#ADD8E6',
                                'shape': 'roundrectangle',
                                'label': 'data(name)',
                                'width': 'data(width)',
                                'height': 'data(height)',
                                'text-valign': 'center',
                                'text-halign': 'center',
                                'text-wrap': 'wrap',
                                'border-width': 2,
                                'border-color': '#eee'
                            }
                        },
                        //                    { selector: 'node[type = "parent"]', style: { 'background-color': '#e0e0e0' } },
                        {
                            selector: 'node:parent',
                            style: {
                                'label': '',
                                'background-color': '#e0e0e0',
                                'width': 400
                            }
                        },
                        {
                            selector: '.traced',
                            style: {
                                'line-color': '#42A5F5',
                                'target-arrow-color': '#42A5F5',
                                'width': 4
                            }
                        },
                        {
                            selector: '.highlighted',
                            style: {
                                'border-width': 4,
                                'border-color': '#FFA726',
                                'background-color': '#FFF3E0'
                            }
                        },
                        {
                            selector: '.path-start',
                            style: {
                                'border-width': 6,
                                'border-color': '#4CAF50',
                                'background-color': '#E8F5E8',
                                'box-shadow': '0 0 20px #4CAF50'
                            }
                        },
                        {
                            selector: '.path-node',
                            style: {
                                'border-width': 3,
                                'border-color': '#2196F3',
                                'background-color': '#E3F2FD'
                            }
                        },
                        {
                            selector: '.path-edge',
                            style: {
                                'line-color': '#2196F3',
                                'target-arrow-color': '#2196F3',
                                'width': 4,
                                'opacity': 0.8
                            }
                        },
                        {
                            selector: 'node.current-node',
                            style: {
                                'border-width': 5,
                                'border-color': '#E91E63',
                                'background-color': '#FCE4EC'
                            }
                        }
                    ]
                });

                cy.ready(() => {
                    expandCollapseApi = cy.expandCollapse({
                        layoutBy: layoutParams,
                        animate: false,
                        cueEnabled: false,
                        fit: false
                    });
                    cy.autoungrabify(true);
                    const allParents = cy.nodes().filter(n => n.isParent());

                    // Sort by depth: deeper parents first
                    const sortedByDepth = allParents.sort((a, b) => {
                        return a.descendants().length - b.descendants().length;
                    });

                    // Collapse all in order
                    for (const parent of sortedByDepth) {
                        try {
                            expandCollapseApi.collapse(parent);
                        } catch (e) {
                            console.warn('Collapse error on startup:', parent.id(), e);
                        }
                    }

                    const layout = cy.layout({
                        name: 'dagre',
                        rankDir: 'TB',
                        fit: true
                    });

                    layout.on('layoutstop', () => {
                        // const bb = cy.elements().boundingBox();
                        // cy.zoom(1.5);
                        // cy.pan({ x: bb.w / 2, y: -bb.y1 + 200 });

                        cy.undoRedo({});
                        cy.nodes('node:parent').forEach(parent => {
                            const label = parent.data('name') || '(group)';
                            parent.data('collapsedLabel', label);
                        });

                        // Click-to-toggle collapse/expand
                        cy.on('tap', 'node', async (e) => {
                            const node = e.target;

                            if (isNavigating) {
                                // Reset navigation and start fresh path tracking
                                backStack = [];
                                forwardStack = [];
                                navigationTrace = [];
                                fullNavigationPath = [node.id()];
                                currentNodeId = node.id();
                                navigateTo(node.id());
                                updatePathHighlighting();
                            } else {
                                handle_expand_collapse(node);
                            }
                        });
                    });

                    layout.run();
                });
            }


            async function expandAllCollapsedNodes(api) {
                let expanded = false;

                const collapsedNodes = cy.nodes('.cy-expand-collapse-collapsed-node');

                for (const node of collapsedNodes) {
                    try {
                        await api.expand(node);
                        expanded = true;
                    } catch (err) {
                        console.warn('Could not expand node:', node.id(), err);
                    }
                }

                // If any were expanded, call again to catch children
                if (expanded) {
                    await expandAllCollapsedNodes(api);
                }
            }

            function wrapRegexPipes(label) {
                // we want to wrap long regexes
                if (label.includes('*|.*')) {
                    // Keep outer parentheses and split inner content by |
                    const parts = label.split('|');
                    return parts.join('\n|\n');
                }
                return label;
            }

            function estimateWidth(name) {
                const lines = name.split('\n').length;
                const longestLine = name.split('\n').reduce((a, b) => a.length > b.length ? a : b, '').length;
                return Math.min(400, 10 * longestLine + 20); // rough guess
            }

            function estimateHeight(label) {
                const lineHeight = 14; // ~10px font + spacing
                const maxWidth = 400;
                const averageCharWidth = 7;
                const charsPerLine = Math.floor(maxWidth / averageCharWidth);

                const lines = label.split('\n').flatMap(line => {
                    const wrappedLines = Math.ceil(line.length / charsPerLine);
                    return Array(wrappedLines).fill(0);
                });

                const numLines = lines.length || 1;
                const padding = 16;

                return (numLines * lineHeight) + padding;
            }

            function groupElementsByFunction(elements) {
                const graphs = new Map();

                for (const el of elements) {
                    const fn = el.data?.root || 'Unknown';
                    if (!graphs.has(fn)) {
                        graphs.set(fn, { name: el.data?.name || 'Unknown', nodes: [], edges: [] });
                    }

                    if (el.data.type === 'edge') {
                        graphs.get(fn).edges.push(el);
                    } else {
                        // Estimate size before pushing the node
                        el.data.width = estimateWidth(el.data.name || '');
                        el.data.height = estimateHeight(el.data.name || '');
                        graphs.get(fn).nodes.push(el);
                    }
                }

                return graphs;
            }

            document.getElementById('loadButton').addEventListener('click', () => {
                clearConditionSidebar();
                const sid = encodeURIComponent(document.getElementById('sidInput').value);
                const version = encodeURIComponent(document.getElementById('versionInput').value);

                if (!sid || !version) {
                    alert("Please enter both sid and version");
                    return;
                }

                let headers = {
                    "sid": sid,
                    "version": version,
                    "fastly_key": secret
                };

                fetch('./elements.json')
                    .then(res => {
                        if (!res.ok) throw new Error("Failed to fetch elements.json");
                        return res.json();
                    })
                    .then(data => {
                        document.addEventListener('keydown', (e) => {
                            // Ignore when typing in input fields
                            if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

                            // Check if modal is open
                            const modal = document.getElementById('parent-choice-modal');
                            const isModalOpen = modal.style.display === 'flex';

                            if (isModalOpen) {
                                // Handle modal navigation
                                const buttons = Array.from(document.querySelectorAll('#parent-choice-buttons .modal-button'));
                                const focusedButton = document.activeElement;
                                const currentIndex = buttons.indexOf(focusedButton);

                                if (e.key === 'ArrowUp' && currentIndex > 0) {
                                    e.preventDefault();
                                    buttons[currentIndex - 1].focus();
                                } else if (e.key === 'ArrowDown' && currentIndex < buttons.length - 1) {
                                    e.preventDefault();
                                    buttons[currentIndex + 1].focus();
                                } else if (e.key === 'Enter' && focusedButton && focusedButton.classList.contains('modal-button')) {
                                    e.preventDefault();
                                    focusedButton.click();
                                } else if (e.key === 'Escape') {
                                    // Close modal without selection (maybe stay at current node)
                                    modal.style.display = 'none';
                                }
                                return; // Don't handle other keys when modal is open
                            }

                            // Normal navigation (when modal is not open)
                            if (e.key === 'ArrowUp') {
                                stepBackward();
                            } else if (e.key === 'ArrowDown') {
                                stepForward();
                            }
                        });
                        functionGraphs = groupElementsByFunction(data.elements);
                        renderSidebar();
                        if (cy) {
                            cy.destroy();
                        }

                    })
                    .catch(err => {
                        console.error("Fetch error:", err);
                        alert("Error fetching data. See console for details.");
                    });
            });

        </script>
